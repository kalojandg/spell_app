<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <title>Spellbook – Super Mini Giga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div class="header-row">
      <h1 style="font-size: 1.1rem; margin: 0;">Spellbook – Super Mini Giga</h1>
      <div class="header-buttons">
        <button id="btn-rest" class="btn-header btn-rest" title="Rest">🛏️ Rest</button>
        <button id="btn-export" class="btn-header" title="Export">📤 Export</button>
        <button id="btn-import" class="btn-header" title="Import">📥 Import</button>
        <input type="file" id="import-file" accept=".json" style="display: none;" />
        <button id="btn-install" class="btn-header" title="Install PWA">📲 Install</button>
      </div>
    </div>
  </header>
  <main>
    <section id="caster-section">
      <h2>Caster</h2>
      <div id="caster-root"></div>
    </section>

    <section id="slots-section">
      <h2>Spell Slots</h2>
      <div id="slots-root"></div>
    </section>

    <section id="spells-section">
      <h2>All Spells</h2>
      <div class="row" style="margin-bottom: 0.5rem;">
        <label style="flex: 1;">
          Ниво
          <select id="filter-level">
            <option value="">Зареждане...</option>
          </select>
        </label>
      </div>
      <div class="row" style="margin-bottom: 0.5rem;">
        <input type="text" id="spell-search" placeholder="Търсене по име..." style="flex: 1; padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px;" />
      </div>
      <div id="spells-root"></div>
      <div id="spells-error" class="error"></div>
    </section>

    <section id="known-spells-section">
      <h2>Known Spells</h2>
      <div id="known-spells-root"></div>
    </section>

    <section id="details-section">
      <h2>Детайли</h2>
      <div id="details-root" class="details small">
        Няма избрана магия.
      </div>
    </section>
  </main>

  <script src="./js/state.js?v=3"></script>
  <script src="./js/api.js?v=3"></script>
  <script src="./js/caster.js?v=3"></script>
  <script src="./js/slots.js?v=3"></script>
  <script src="./js/spells.js?v=3"></script>
  <script src="./js/details.js?v=3"></script>
  <script src="./js/app.js?v=3"></script>
</body>
</html>
