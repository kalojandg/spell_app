<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <title>Spellbook – Super Mini Giga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
    }
    header {
      padding: 0.5rem 1rem;
      background: #222;
      border-bottom: 1px solid #333;
    }
    main {
      padding: 0.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
      }
    }
    section {
      border: 1px solid #333;
      border-radius: 0.5rem;
      padding: 0.5rem;
      background: #181818;
    }
    h2 {
      margin-top: 0;
      font-size: 1rem;
      border-bottom: 1px solid #333;
      padding-bottom: 0.25rem;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
      gap: 0.1rem;
    }
    input, select, button {
      font: inherit;
      padding: 0.25rem 0.4rem;
      border-radius: 0.25rem;
      border: 1px solid #444;
      background: #111;
      color: #eee;
    }
    button {
      cursor: pointer;
    }
    .row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .derived {
      margin-top: 0.25rem;
      font-size: 0.9rem;
    }
    .slots-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .slot-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.9rem;
    }
    .slot-row span.level {
      width: 4rem;
    }
    .slot-row span.count {
      width: 3rem;
      text-align: center;
    }
    .spells-container {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      max-height: 60vh;
      overflow-y: auto;
    }
    .spell-item {
      border: 1px solid #333;
      border-radius: 0.35rem;
      padding: 0.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      background: #131313;
    }
    .spell-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.25rem;
    }
    .spell-name-btn {
      background: none;
      border: none;
      color: #fff;
      padding: 0;
      text-align: left;
      cursor: pointer;
      font-weight: 600;
    }
    .spell-tags {
      font-size: 0.75rem;
      opacity: 0.8;
    }
    .spell-flags {
      font-size: 0.75rem;
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .badge {
      border-radius: 999px;
      border: 1px solid #444;
      padding: 0.05rem 0.4rem;
    }
    .known {
      border-color: #4caf50;
      color: #c8f7c5;
    }
    .prepared {
      border-color: #2196f3;
      color: #bbdefb;
    }
    .details {
      font-size: 0.86rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .small {
      font-size: 0.8rem;
      opacity: 0.85;
    }
    .btn-xs {
      font-size: 0.75rem;
      padding: 0.1rem 0.3rem;
    }
    .error {
      color: #ff8a80;
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <header>
    <h1 style="font-size: 1.1rem; margin: 0;">Spellbook – Super Mini Giga</h1>
  </header>
  <main>
    <section id="caster-section">
      <h2>Caster</h2>
      <div id="caster-root"></div>
    </section>

    <section id="slots-section">
      <h2>Spell Slots</h2>
      <div id="slots-root"></div>
    </section>

    <section id="spells-section">
      <h2>Spells</h2>
      <div class="row" style="margin-bottom: 0.5rem;">
        <label style="flex: 1;">
          Ниво
          <select id="filter-level">
            <option value="0">Cantrips</option>
            <option value="1">1-во</option>
            <option value="2">2-ро</option>
            <option value="3">3-то</option>
            <option value="4" selected>4-то</option>
            <option value="5">5-то</option>
            <option value="6">6-то</option>
            <option value="7">7-мо</option>
            <option value="8">8-мо</option>
            <option value="9">9-то</option>
          </select>
        </label>
        <button id="btn-load-spells">Зареди магии</button>
      </div>
      <div id="spells-root"></div>
      <div id="spells-error" class="error"></div>
    </section>

    <section id="details-section">
      <h2>Детайли</h2>
      <div id="details-root" class="details small">
        Няма избрана магия.
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
